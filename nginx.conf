worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    # Logs
    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log warn;

    # Optimizaciones básicas
    sendfile        on;
    keepalive_timeout 65;
    client_max_body_size 10M;

    upstream orchestrator_api {
        server api:8000;
    }

    server {
        listen 80;
        server_name localhost; # Cambiar en producción por el dominio real

        # Redirección a HTTPS en producción
        # return 301 https://$host$request_uri;

        location / {
            proxy_pass http://orchestrator_api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # Timeouts para peticiones largas
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }
    }

    # Configuración SSL (Descomentar para producción)
    # server {
    #     listen 443 ssl;
    #     server_name tu-dominio.com;
    #
    #     ssl_certificate /etc/nginx/certs/fullchain.pem;
    #     ssl_certificate_key /etc/nginx/certs/privkey.pem;
    #
    #     location / {
    #         proxy_pass http://orchestrator_api;
    #         proxy_set_header Host $host;
    #         proxy_set_header X-Real-IP $remote_addr;
    #     }
    # }
}